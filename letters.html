    <style>
        /* Screen Styles */
        .layout-wrapper {
            display: flex;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        .control-sidebar {
            width: 420px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px;
            gap: 20px;
            flex-shrink: 0;
        }

        .preview-area {
            flex: 1;
            background: #f1f5f9;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* A4 Page Formatting for screen and print */
        .a4-page {
            background: #ffffff;
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            color: #000000 !important;
            padding: 7mm 12mm 6mm 12mm;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10pt;
            line-height: 1.45;
            position: relative;
            overflow: hidden;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .print-title-box {
            font-size: 12pt;
            font-weight: bold;
            background: #000000 !important;
            color: #ffffff !important;
            padding: 4px 20px;
            display: inline-block;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .a4-content {
            flex: 1;
            color: #000000 !important;
        }

        /* Letterhead logo container */
        .logo-container {
            border: 1.5px solid #000000;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 90px;
            box-sizing: border-box;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) contrast(1.3);
            -webkit-filter: grayscale(100%) contrast(1.3);
        }

        /* Print Override */
        @media print {
            html, body {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
                color: #000000 !important;
                overflow: hidden !important;
            }

            .no-print,
            .modern-top-nav,
            .control-sidebar,
            #currentTime {
                display: none !important;
            }

            .layout-wrapper {
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                display: block !important;
            }

            .preview-area {
                padding: 0 !important;
                margin: 0 !important;
                background: transparent !important;
                overflow: visible !important;
                display: block !important;
            }

            .a4-page {
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                min-height: 297mm !important;
                padding: 7mm 12mm 6mm 12mm !important;
                box-shadow: none !important;
                margin: 0 !important;
                border: none !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                page-break-before: avoid !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>

    <!-- Scripts -->
    <script>
        // Global variables for selected customer data
        let currentCust = null;
        let allCustomers = [];

        
        function onCustomerSelect() {
            const selector = document.getElementById('customerSelector');
            const selectedVal = selector.value;
            if (!selectedVal) {
                currentCust = null;
                clearForm();
                renderLetter();
                return;
            }
            const cust = allCustomers.find(c => (c.id && c.id.toString() === selectedVal) || (c.accountNo && c.accountNo.toString() === selectedVal));
            if (cust) {
                currentCust = cust;
                populateForm(cust);
                renderLetter();
            }
        }

        function populateForm(cust) {
            if (!cust) return;
            const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = (val !== undefined && val !== null) ? val : ''; };

            setVal('cName', cust.name || '');
            setVal('cAccNo', cust.accountNo || '');
            setVal('cAddress', cust.address || '');
            setVal('cLoanAccNo', cust.loanAccountNo || cust.accountNo || '');

            setVal('arrInstallments', cust.arrearsInstallments || 0);
            setVal('arrPrincipal', cust.arrearsPrincipal || 0);
            setVal('arrInterest', cust.arrearsInterest || 0);
            setVal('arrPenalty', cust.penaltyInterest || 0);
            setVal('arrTotal', cust.totalPayable || ((cust.arrearsPrincipal || 0) + (cust.arrearsInterest || 0) + (cust.penaltyInterest || 0)));

            setVal('demandPrincipal', cust.arrearsPrincipal || cust.balanceAmount || cust.loanAmount || 0);
            setVal('demandInterest', cust.arrearsInterest || 0);

            setVal('cG1Name', cust.guarantor1 || cust.guarantor1Name || '');
            setVal('cG1Address', cust.guarantor1Address || '');
            setVal('cG2Name', cust.guarantor2 || cust.guarantor2Name || '');
            setVal('cG2Address', cust.guarantor2Address || '');
        }

        function clearForm() {
            const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };

            setVal('cName', '');
            setVal('cAccNo', '');
            setVal('cAddress', '');
            setVal('cLoanAccNo', '');

            setVal('arrInstallments', 0);
            setVal('arrPrincipal', 0);
            setVal('arrInterest', 0);
            setVal('arrPenalty', 0);
            setVal('arrTotal', 0);

            setVal('demandPrincipal', 0);
            setVal('demandInterest', 0);

            setVal('cG1Name', '');
            setVal('cG1Address', '');
            setVal('cG2Name', '');
            setVal('cG2Address', '');
        }

        function updateTemplateFields() {
            const letterType = document.getElementById('letterType').value;
            const reminderFields = document.getElementById('reminderFields');
            const lodFields = document.getElementById('lodFields');

            if (letterType === 'lod' || letterType === 'legal_reminder') {
                if (lodFields) lodFields.classList.remove('hidden');
                if (reminderFields) reminderFields.classList.add('hidden');
            } else {
                if (lodFields) lodFields.classList.add('hidden');
                if (reminderFields) reminderFields.classList.remove('hidden');
            }
        }

        function calculateTotal() {
            const p = parseFloat(document.getElementById('arrPrincipal').value) || 0;
            const i = parseFloat(document.getElementById('arrInterest').value) || 0;
            const pen = parseFloat(document.getElementById('arrPenalty').value) || 0;
            document.getElementById('arrTotal').value = (p + i + pen).toFixed(2);
        }

        window.initPage = async () => {
            const isHealthy = await checkDatabaseHealth();
            if (!isHealthy) return;

            // Load selector options
            allCustomers = await getAllCustomers();
            const selector = document.getElementById('customerSelector');
            selector.innerHTML = '<option value="">-- Choose a Customer --</option>';
            allCustomers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id || c.accountNo;
                const loanLabel = c.loanAccountNo ? ` [${c.category || 'Loan'}: ${c.loanAccountNo}]` : (c.category ? ` [${c.category}]` : '');
                opt.textContent = `${c.accountNo} - ${c.name}${loanLabel}`;
                opt.dataset.id = c.id || '';
                opt.dataset.accountNo = c.accountNo || '';
                opt.dataset.loanAccountNo = c.loanAccountNo || '';
                selector.appendChild(opt);
            });

            // Set default date to today
            document.getElementById('letterDate').valueAsDate = new Date();
            const duePayDate = new Date();
            duePayDate.setDate(duePayDate.getDate() + 14); // 14 days later by default
            document.getElementById('duePaymentDate').valueAsDate = duePayDate;

            // Read URL Params if any
            const params = new URLSearchParams(window.location.search);
            const idFromUrl = params.get('id');
            const accFromUrl = params.get('accountNo');
            if (idFromUrl) {
                const foundOpt = Array.from(selector.options).find(opt => opt.value.toString() === idFromUrl.toString() || (opt.dataset && opt.dataset.id === idFromUrl));
                if (foundOpt) {
                    selector.value = foundOpt.value;
                    onCustomerSelect();
                }
            } else if (accFromUrl) {
                const foundOpt = Array.from(selector.options).find(opt => opt.value.toString() === accFromUrl.toString() || (opt.dataset && opt.dataset.accountNo === accFromUrl));
                if (foundOpt) {
                    selector.value = foundOpt.value;
                    onCustomerSelect();
                }
            } else {
                renderLetter();
            }
        };

        // Render Letter Function
        function renderLetter() {
            const letterContainer = document.getElementById('letterA4Page') || document.getElementById('renderedLetter');
            if (!letterContainer) return;

            const letterType = document.getElementById('letterType')?.value || 'reminder1';
            const lang = document.getElementById('letterLang')?.value || 'sin';
            const letterDateVal = document.getElementById('letterDate')?.value;
            const formattedLetterDate = letterDateVal ? new Date(letterDateVal).toLocaleDateString('en-GB') : new Date().toLocaleDateString('en-GB');

            const name = (document.getElementById('cName')?.value || '').trim() || currentCust?.name || '...................................................';
            const memberId = (document.getElementById('cAccNo')?.value || '').trim() || currentCust?.accountNo || '............';
            const address = (document.getElementById('cAddress')?.value || '').trim() || currentCust?.address || '...........................................................................';
            const loanAccNo = (document.getElementById('cLoanAccNo')?.value || '').trim() || currentCust?.loanAccountNo || currentCust?.accountNo || '........................';
            const loanGrantedDate = currentCust?.grantedDate || currentCust?.loanDate || '............';
            const loanAmountVal = currentCust?.loanAmount || 0;
            const loanAmountStr = loanAmountVal ? loanAmountVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '..................';
            
            const demandPrincipal = parseFloat(document.getElementById('demandPrincipal')?.value) || currentCust?.arrearsPrincipal || currentCust?.balanceAmount || currentCust?.loanAmount || 0;
            const demandInterest = parseFloat(document.getElementById('demandInterest')?.value) || currentCust?.arrearsInterest || 0;
            const _arrTotalField = parseFloat(document.getElementById('arrTotal')?.value) || 0;
            const demandTotal = _arrTotalField > 0 ? _arrTotalField : (demandPrincipal + demandInterest);
            const demandDueDate = document.getElementById('duePaymentDate')?.value ? new Date(document.getElementById('duePaymentDate').value).toLocaleDateString('en-GB') : '..................';
            const demandDueTime = document.getElementById('duePaymentTime')?.value || '12.00 PM';

            const arrearsInstallments = parseFloat(document.getElementById('arrInstallments')?.value) || currentCust?.arrearsInstallments || 0;

                                Please be informed that the above-mentioned amount due as of <strong>${formattedLetterDate}</strong> must be settled within 14 days of receiving this letter. Interest will continue to accumulate for any further delayed days.
                            </div>

                            ${body2 ? `
                            <div style="text-align: justify; text-indent: 40px; margin-bottom: 8px; font-size: 9.5pt; line-height: 1.45; color: #000000;">
                                ${body2}
                            </div>
                            ` : ''}

                            ${finalParagraph ? `
                            <div style="text-align: justify; text-indent: 40px; margin-bottom: 8px; font-size: 9.5pt; line-height: 1.45; color: #000000;">
                                ${finalParagraph}
                            </div>
                            ` : ''}

                            <!-- Sign Off -->
                            <div style="margin-top: 8px; font-size: 9.5pt; color: #000000;">
                                <div>Thank you,</div>
                                <div>Yours faithfully,</div>
                                ${signers}
                            </div>

                            <!-- Copies Section -->
                            <div style="margin-top: 10px; border-top: 1px dashed #000000; padding-top: 10px; font-size: 8.5pt; color: #000000; line-height: 1.4;">
                                ${g1Name ? `<div>Copy 01: First Guarantor - ${currentCust ? currentCust.guarantor1 : ''} &nbsp;&nbsp; ${g1Address ? `(${g1Address})` : ''}</div>` : ''}
                                ${g2Name ? `<div>Copy 02: Second Guarantor - ${currentCust ? currentCust.guarantor2 : ''} &nbsp;&nbsp; ${g2Address ? `(${g2Address})` : ''}</div>` : ''}
                            </div>
                        </div>
                        ${footerHtml}
                    `;
                }
            }

            letterContainer.innerHTML = htmlContent;

            // Auto-scale: shrink content if it overflows A4 height
            requestAnimationFrame(() => {
                const pageH = letterContainer.offsetHeight;
                const scrollH = letterContainer.scrollHeight;
                if (scrollH > pageH && pageH > 0) {
                    const scale = Math.max(0.75, pageH / scrollH);
                    letterContainer.style.fontSize = (scale * 9.5).toFixed(2) + 'pt';
                } else {
                    letterContainer.style.fontSize = '';
                }
            });
        }

        // Action Handler: Print & optional Save to History
        async function handlePrint() {
            const selector = document.getElementById('customerSelector');
            const accNo = selector.value;
            const letterType = document.getElementById('letterType').value;
            const saveHistory = document.getElementById('saveActionHistory').checked;

            if (saveHistory && accNo) {
                let letterName = '';
                if (letterType === 'reminder1') letterName = 'Attention Letter 1';
                else if (letterType === 'reminder2') letterName = 'Attention Letter 2';
                else if (letterType === 'final_notice') letterName = 'Attention Letter 3';
                else if (letterType === 'lod') letterName = 'Letter of Demand (LOD)';
                else if (letterType === 'legal_referral') letterName = 'Legal Department Referral';
                else if (letterType === 'business_loan') letterName = 'Business Loan Notice';
                else if (letterType === 'legal_reminder') letterName = 'Legal Reminder Notice';
                else if (letterType === 'agreement_expired') letterName = 'Agreement Expired Notice';

                const totalVal = parseFloat(document.getElementById('arrTotal').value) || 0;
                const noteText = `Auto-generated printable letter in ${document.getElementById('letterLang').value === 'sin' ? 'Sinhala' : 'English'}. Total Outstanding: LKR ${totalVal.toLocaleString()}`;

                const actionData = {
                    customerAccountNo: (currentCust && currentCust.accountNo) || accNo,
                    loanAccountNo: (currentCust && currentCust.loanAccountNo) || document.getElementById('cLoanAccNo').value.trim() || accNo,
                    customerId: (currentCust && currentCust.id) || null,
                    customerName: (currentCust && currentCust.name) || '',
                    actionType: letterName,
                    date: document.getElementById('letterDate').value || new Date().toISOString().split('T')[0],
                    response: "Letter printed",
                    officerNote: noteText,
                    followUpDate: null
                };

                const success = await addAction(actionData);
                if (success) {
                    console.log("Logged letter to customer action history.");
                } else {
                    console.error("Failed to log letter to customer action history.");
                }
            }

            window.print();
        }

        // Auto-run initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { if (typeof window.initPage === 'function') window.initPage(); });
        } else {
            if (typeof window.initPage === 'function') window.initPage();
        }
        setTimeout(() => { if (typeof window.initPage === 'function') window.initPage(); }, 150);
    </script>
    <script src="js/app.js?v=3.21"></script>
    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="handleRestore(event)">
</body>
