    <script>
        // Global variables for selected customer data
        let currentCust = null;
        let allCustomers = [];

        window.initPage = async () => {
            const isHealthy = await checkDatabaseHealth();
            if (!isHealthy) return;

            // Load selector options
            allCustomers = await getAllCustomers();
            const selector = document.getElementById('customerSelector');
            allCustomers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.accountNo;
                opt.textContent = `${c.accountNo} - ${c.name}`;
                selector.appendChild(opt);
            });

            // Set default date to today
            document.getElementById('letterDate').valueAsDate = new Date();
            const duePayDate = new Date();
            duePayDate.setDate(duePayDate.getDate() + 14); // 14 days later by default
            document.getElementById('duePaymentDate').valueAsDate = duePayDate;

            // Read URL Params if any
            const params = new URLSearchParams(window.location.search);
            const accFromUrl = params.get('accountNo');
            if (accFromUrl) {
                const foundOpt = Array.from(selector.options).find(opt => opt.value.toString() === accFromUrl.toString());
                if (foundOpt) {
                    selector.value = foundOpt.value;
                    onCustomerSelect();
                }
            } else {
                renderLetter();
            }
        };

        // Populate form fields on customer select
        function onCustomerSelect() {
            const selector = document.getElementById('customerSelector');
            const accNo = selector.value;
            if (!accNo) {
                currentCust = null;
                resetFormInputs();
                renderLetter();
                return;
            }

            currentCust = allCustomers.find(c => c.accountNo.toString() === accNo.toString());
            if (!currentCust) return;

            document.getElementById('cName').value = currentCust.name || '';
            document.getElementById('cAddress').value = currentCust.address || '';
            document.getElementById('cLoanAccNo').value = currentCust.loanAccountNo || currentCust.accountNo || '';
            document.getElementById('cG1Name').value = currentCust.guarantor1 || '';
            document.getElementById('cG1Address').value = currentCust.guarantor1Address || '';
            document.getElementById('cG2Name').value = currentCust.guarantor2 || '';
            document.getElementById('cG2Address').value = currentCust.guarantor2Address || '';

            // Set defaults for loan amounts
            document.getElementById('demandPrincipal').value = currentCust.loanAmount || 0;
            calculateTotal();
            renderLetter();
        }

        function resetFormInputs() {
            document.getElementById('cName').value = '';
            document.getElementById('cAddress').value = '';
            document.getElementById('cLoanAccNo').value = '';
            document.getElementById('cG1Name').value = '';
            document.getElementById('cG1Address').value = '';
            document.getElementById('cG2Name').value = '';
            document.getElementById('cG2Address').value = '';
        }

        // Toggle inputs between Reminders and LOD
        function updateTemplateFields() {
            const type = document.getElementById('letterType').value;
            const remSection = document.getElementById('reminderFields');
            const lodSection = document.getElementById('lodFields');

            if (type === 'lod' || type === 'legal_reminder') {
                remSection.classList.add('hidden');
                lodSection.classList.remove('hidden');
            } else {
                remSection.classList.remove('hidden');
                lodSection.classList.add('hidden');
            }
            calculateTotal();
        }

        // Auto-calculate the total of outstanding amounts
        function calculateTotal() {
            const type = document.getElementById('letterType').value;
            let total = 0;

            if (type === 'lod' || type === 'legal_reminder') {
                const principal = parseFloat(document.getElementById('demandPrincipal').value) || 0;
                const interest = parseFloat(document.getElementById('demandInterest').value) || 0;
                total = principal + interest;
            } else {
                const principal = parseFloat(document.getElementById('arrPrincipal').value) || 0;
                const interest = parseFloat(document.getElementById('arrInterest').value) || 0;
                const penalty = parseFloat(document.getElementById('arrPenalty').value) || 0;
                total = principal + interest + penalty;
            }

            document.getElementById('arrTotal').value = total.toFixed(2);
        }

            if (!letterContainer) return;

            // Fields values

            const address = document.getElementById('cAddress').value || '............................................................';
            const memberId = currentCust ? currentCust.accountNo : '....................';
            const loanAccNo = document.getElementById('cLoanAccNo').value || '....................';

            const g2Address = document.getElementById('cG2Address').value || '';

            const arrearsInstallments = parseInt(document.getElementById('arrInstallments').value) || 0;
            const arrearsPrincipal = parseFloat(document.getElementById('arrPrincipal').value) || 0;
            const arrearsInterest = parseFloat(document.getElementById('arrInterest').value) || 0;
            const arrearsPenalty = parseFloat(document.getElementById('arrPenalty').value) || 0;

            const demandPrincipal = parseFloat(document.getElementById('demandPrincipal').value) || 0;
            const demandInterest = parseFloat(document.getElementById('demandInterest').value) || 0;

            const demandDateVal = document.getElementById('duePaymentDate').value;

            const demandDueTime = document.getElementById('duePaymentTime').value || '12.00 PM';

            const initialLoanAmount = currentCust ? currentCust.loanAmount : 0;
            const loanAmountStr = initialLoanAmount ? initialLoanAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '....................';

            // String Formatters
            const formatCurrency = (val) => val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            let htmlContent = '';

                                <div style="font-size: 10px; font-weight: 700; display: flex; gap: 28px; color: #000000;">
                                    <span>Reg No: ????/395</span>
                                    <span>Reg Date: 1987/03/24</span>
                                </div>
                            </div>


                        </div>

            } else {
                // For Legal Reminder: custom double-bordered top header (no normal letterhead)
